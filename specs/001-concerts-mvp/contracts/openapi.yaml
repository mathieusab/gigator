openapi: 3.0.3
info:
  title: Gigator Concerts MVP API (spec contracts)
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /concerts:
    get:
      summary: List concerts (upcoming and past)
      parameters:
        - name: upcoming
          in: query
          schema:
            type: boolean
          description: If true, return upcoming concerts only
      responses:
        '200':
          description: Concert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concert'
    post:
      summary: Create a concert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcertCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
  /concerts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get concert by id
      responses:
        '200':
          description: Concert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
    put:
      summary: Update concert
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcertUpdate'
      responses:
        '200':
          description: Updated concert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
    delete:
      summary: Delete concert
      responses:
        '204':
          description: Deleted

  /gmail/threads:
    get:
      summary: Lookup Gmail threads for a contact email (proxied)
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: Contact email to search threads for
      responses:
        '200':
          description: Thread list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GmailThread'
        '401':
          description: Unauthorized or missing Gmail permission

components:
  schemas:
    Concert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date_start:
          type: string
          format: date-time
        date_end:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        venue_name:
          type: string
        city:
          type: string
        country:
          type: string
        address:
          type: string
        lat:
          type: number
          format: float
          nullable: true
        lng:
          type: number
          format: float
          nullable: true
        venue_contact_name:
          type: string
          nullable: true
        venue_contact_email:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConcertCreate:
      type: object
      required: [date_start, venue_name, created_by]
      properties:
        date_start:
          type: string
          format: date-time
        date_end:
          type: string
          format: date-time
        venue_name:
          type: string
        city:
          type: string
        country:
          type: string
        address:
          type: string
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
        venue_contact_name:
          type: string
        venue_contact_email:
          type: string
        notes:
          type: string
        created_by:
          type: string
          format: uuid
    ConcertUpdate:
      type: object
      properties:
        date_start:
          type: string
          format: date-time
        date_end:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        venue_name:
          type: string
        city:
          type: string
        country:
          type: string
        address:
          type: string
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
        venue_contact_name:
          type: string
        venue_contact_email:
          type: string
        notes:
          type: string
    GmailThread:
      type: object
      properties:
        id:
          type: string
        snippet:
          type: string
        threadId:
          type: string
        historyId:
          type: string
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              threadId:
                type: string
              snippet:
                type: string
              internalDate:
                type: string
                format: date-time

security: []
