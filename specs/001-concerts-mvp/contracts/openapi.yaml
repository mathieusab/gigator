openapi: 3.0.3
info:
  title: Gigator Backend API (Gmail proxy)
  version: 0.2.0
  description: |
    This OpenAPI document describes the backend Express API currently implemented in this repo.

    Notes:
    - Concerts CRUD is performed directly by the frontend via Supabase (PostgREST). There is no `/concerts` backend route.
    - Gmail access is proxied by this backend and authorized using the Supabase access token (JWT) as a Bearer token.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /gmail/threads:
    get:
      summary: Lookup Gmail threads for a contact email (proxied)
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: Contact email to search threads for
        - name: maxThreads
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: Maximum number of threads to return (default is server-defined)
      responses:
        '200':
          description: Thread list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GmailThread'
        '401':
          description: Unauthorized or missing Gmail permission
        '403':
          description: Access denied (inactive app user)

  /gmail/oauth/start:
    post:
      summary: Start Gmail OAuth (returns Google OAuth URL)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirectTo:
                  type: string
                  description: Relative path in the frontend (e.g. /concerts/123)
              required: [redirectTo]
      responses:
        '200':
          description: OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required: [url]
        '401':
          description: Unauthorized
        '403':
          description: Access denied (inactive app user)

  /gmail/oauth/callback:
    get:
      summary: OAuth callback (Google redirects here)
      description: |
        Exchanges the OAuth `code` for access/refresh tokens, reads Gmail profile,
        stores the encrypted refresh token in Supabase, then redirects back to the frontend.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect back to the frontend
        '200':
          description: HTML confirmation page (when FRONTEND_ORIGIN is not configured)
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Missing or invalid parameters

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GmailThread:
      type: object
      properties:
        id:
          type: string
        snippet:
          type: string
        threadId:
          type: string
        historyId:
          type: string
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              threadId:
                type: string
              snippet:
                type: string
              internalDate:
                type: string
                format: date-time

