<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gigator - UX Color Themes</title>
  <style>
    body{font-family:system-ui,Arial;background:#fff;color:#111;padding:20px}
    .row{display:flex;gap:16px;flex-wrap:wrap}
    .swatch{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;width:260px}
    .top{padding:12px;font-weight:700}
    .c{height:44px;display:flex;align-items:center;padding:0 12px;font-size:12px}
  </style>
</head>
<body>
  <h1>Gigator — Color Tokens (MVP defaults)</h1>
  <p>Base: fond blanc, texte noir, accent discret. Tokens remplaçables quand la charte finale est fournie.</p>
  <div class="row">
    <div class="swatch">
      <div class="top">Theme A — Minimal utilitarian</div>
      <div class="c" style="background:#FFFFFF;color:#111">background #FFFFFF</div>
      <div class="c" style="background:#F7F8FA;color:#111">surface #F7F8FA</div>
      <div class="c" style="background:#000000;color:#fff">text #000000</div>
      <div class="c" style="background:#0A66C2;color:#fff">accent (placeholder) #0A66C2</div>
      <div class="c" style="background:#10B981;color:#111">success #10B981</div>
      <div class="c" style="background:#F59E0B;color:#111">warning #F59E0B</div>
      <div class="c" style="background:#EF4444;color:#fff">danger #EF4444</div>
    </div>
  </div>
</body>
</html>
